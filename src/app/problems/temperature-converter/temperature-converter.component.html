<div class="temperature-converter">
    <label class="temperature-converter-column">
        <input class="temperature-converter-column-top-row" type="text" 
        [(ngModel)]="celsius" (ngModelChange)="setCelsius($event)"/>
        <div class="temperature-converter-column-bottom-row">Celcius</div>
    </label>

    <div class="temperature-converter-column">
        <div class="temperature-converter-column-top-row"> = </div>
    </div>

    <label class="temperature-converter-column">
        <input class="temperature-converter-column-top-row" type="text" 
        [(ngModel)]="fahrenheit" (ngModelChange)="setFahrenheit($event)"/>
        <div class="temperature-converter-column-bottom-row">Fahrenheit</div>
    </label>

    <button (click)="reset()">Reset</button>
</div>
